<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Life Chatbot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="chat-header">

            <div class="profile">
                <div class="avatar">🤖</div>

                <div class="profile-info">
                    <h1>Daily Life Chatbot</h1>

                    <div class="status">
                        <span class="status-dot"></span>
                        Online • Ready to chat
                    </div>
                </div>
            </div>

            <button class="clear-btn" onclick="clearChat()">
                🧹 Clear
            </button>

        </header>


        <!-- Chat Area -->
        <main class="chat-area" id="chatArea">

            <!-- Welcome message -->
            <div class="message bot-message">

                <div class="message-avatar">
                    🤖
                </div>

                <div class="message-content">

                    <div class="message-name">
                        Bot
                    </div>

                    <div class="bubble">
                        Hi! 👋 I'm your Daily Life Chatbot.
                        <br><br>
                        I'm here to have a friendly conversation with you.
                        You can talk to me about your day, hobbies, food,
                        music, movies, travel and more! 😊
                    </div>

                    <div class="time">
                        Just now
                    </div>

                </div>

            </div>


            <!-- Suggested questions -->

            <div class="suggestions">

                <p>Try asking me:</p>

                <button onclick="useSuggestion('How are you?')">
                    😊 How are you?
                </button>

                <button onclick="useSuggestion('I had a good day')">
                    🌞 My day
                </button>

                <button onclick="useSuggestion('I like music')">
                    🎵 Music
                </button>

                <button onclick="useSuggestion('I like traveling')">
                    🌍 Travel
                </button>

            </div>

        </main>


        <!-- Input Area -->
        <footer class="input-area">

            <div class="input-container">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type your message..."
                    autocomplete="off"
                >

                <button
                    class="send-btn"
                    onclick="sendMessage()"
                    title="Send message"
                >
                    ➤
                </button>

            </div>

            <div class="footer-text">
                Rule-Based Chatbot • Python Project
            </div>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
